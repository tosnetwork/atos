# PostgreSQL 16 Phase 7A baseline. Include from postgresql.conf only after
# installing wal-archive.sh outside the application host's ordinary write
# boundary and supplying its Object Lock/KMS environment through the service.
wal_level = replica
archive_mode = on
archive_command = '/usr/local/libexec/atos-wal-archive %p %f'
archive_timeout = '60s'
wal_compression = on
max_wal_senders = 5
wal_keep_size = '2GB'
max_slot_wal_keep_size = '20GB'
full_page_writes = on
wal_log_hints = on
track_commit_timestamp = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_checkpoints = on
log_min_duration_statement = '2s'
password_encryption = 'scram-sha-256'
ssl = on
