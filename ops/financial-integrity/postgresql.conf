# PostgreSQL 16 Phase 7A baseline. Include from postgresql.conf only after
# substituting the deployment-owned absolute archive destination.
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/atos-wal/%f && install -m 0600 %p /var/lib/atos-wal/%f'
archive_timeout = '60s'
wal_compression = on
max_wal_senders = 5
wal_keep_size = '2GB'
max_slot_wal_keep_size = '20GB'
full_page_writes = on
wal_log_hints = on
track_commit_timestamp = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_checkpoints = on
log_min_duration_statement = '2s'
password_encryption = 'scram-sha-256'
ssl = on
