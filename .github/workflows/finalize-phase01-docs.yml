name: finalize-phase01-docs

on:
  push:
    branches:
      - agent/phase0-phase1-completion
    paths:
      - '.github/workflows/finalize-phase01-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase0-phase1-completion
          fetch-depth: 0
      - name: Synchronize public Phase 0/1 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          openapi = Path('api/openapi.yaml')
          text = openapi.read_text()
          old = '''        spend_policy:\n          type: object\n          required: [per_call_autonomous_limit, daily_limit, remaining_today]\n          properties:\n            per_call_autonomous_limit: {$ref: '#/components/schemas/Money'}\n            daily_limit: {$ref: '#/components/schemas/Money'}\n            remaining_today: {$ref: '#/components/schemas/Money'}\n'''
          new = '''        spend_policy:\n          type: object\n          required: [per_call_autonomous_limit, daily_limit, remaining_today, reset_at]\n          properties:\n            per_call_autonomous_limit: {$ref: '#/components/schemas/Money'}\n            daily_limit: {$ref: '#/components/schemas/Money'}\n            remaining_today: {$ref: '#/components/schemas/Money'}\n            reset_at: {type: string, format: date-time}\n'''
          if old not in text:
              raise SystemExit('SpendPolicy OpenAPI block not found')
          openapi.write_text(text.replace(old, new))

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '- Managed accounts use configurable internal credits, automatic spend policy\n  and server-issued confirmation records for higher-value calls;',
              '- Managed accounts use configurable internal credits, per-call and UTC-day spend policy,\n  automatic daily-window reset and server-issued confirmation records for higher-value calls;',
          )
          text = text.replace(
              '| Managed credits | Configurable starting balance, per-call limit, daily limit and exact server-side confirmations |',
              '| Managed credits | Configurable starting balance, per-call limit, UTC daily limit/reset and exact server-side confirmations |',
          )
          if '## Validation' not in text:
              text += '''\n\n## Validation\n\nEvery proposed revision is checked at its exact Git commit with:\n\n```text\ngofmt\nOpenAPI 3.1 YAML validation\ngo vet ./...\ngo test -race ./...\nPostgreSQL 16 migrations\ngo test -race ./internal/store/postgres\n```\n\nThe acceptance suite includes the Phase 0 three-mode contract fixture and the\nPhase 1 HTTP flow from Skill retrieval and Device Authorization through Quote,\nspending confirmation, Managed execution, signed receipt, settlement and exact\naccount mutation.\n'''
          readme.write_text(text)
          PY

          ruby -e "require 'yaml'; YAML.load_file('api/openapi.yaml')"
          git diff --check
          rm .github/workflows/finalize-phase01-docs.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md api/openapi.yaml .github/workflows/finalize-phase01-docs.yml
          git commit -m 'docs: synchronize Phase 0 and Phase 1 contracts'
          git push origin HEAD:agent/phase0-phase1-completion
