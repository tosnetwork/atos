name: apply-phase1-crashsafe-stage1

on:
  push:
    branches:
      - agent/phase0-phase1-completion
    paths:
      - .github/workflows/apply-phase1-crashsafe-stage1.yml
      - tools/apply_phase1_crashsafe_stage1.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atos
          POSTGRES_PASSWORD: atos
          POSTGRES_DB: atos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atos -d atos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATOS_DATABASE_URL: postgres://atos:atos@127.0.0.1:5432/atos_test?sslmode=disable
      ATOS_TEST_DATABASE_URL: postgres://atos:atos@127.0.0.1:5432/atos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase0-phase1-completion
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Apply crash-safety primitives
        run: |
          python3 tools/apply_phase1_crashsafe_stage1.py
          gofmt -w internal/domain/job.go internal/store/store.go internal/store/memory/memory.go internal/store/postgres/postgres.go internal/store/postgres/crash_safety_test.go internal/adapters/toscore/mock/mock.go internal/adapters/tosprotocol/core.go internal/httpapi/auth.go internal/httpapi/phase01_postgres_acceptance_test.go internal/httpapi/auth_decision_security_test.go
          git diff --check
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: Unit and race tests
        run: go test -race ./...
      - name: PostgreSQL crash-safety tests
        run: go test -race ./internal/store/postgres ./internal/httpapi
      - name: Commit validated primitives
        run: |
          git add internal api migrations
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add crash-safe Phase 1 economic primitives'
          git push origin HEAD:agent/phase0-phase1-completion
