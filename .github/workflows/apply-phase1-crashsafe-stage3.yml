name: apply-phase1-crashsafe-stage3

on:
  push:
    branches:
      - agent/phase0-phase1-completion
    paths:
      - .github/workflows/apply-phase1-crashsafe-stage3.yml
      - tools/apply_phase1_crashsafe_stage3.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atos
          POSTGRES_PASSWORD: atos
          POSTGRES_DB: atos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atos -d atos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ATOS_DATABASE_URL: postgres://atos:atos@127.0.0.1:5432/atos_test?sslmode=disable
      ATOS_TEST_DATABASE_URL: postgres://atos:atos@127.0.0.1:5432/atos_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase0-phase1-completion
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Materialize final failure-injection tests
        run: |
          python3 tools/apply_phase1_crashsafe_stage3.py
          gofmt -w internal/service/economic_crash_safety_test.go
          git diff --check
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: Full race suite
        run: go test -race ./...
      - name: Dedicated economic crash-safety suite
        run: go test -race -run 'CrashRecovery|PostgresRestart|Reconcile' ./internal/service
      - name: PostgreSQL and HTTP acceptance gates
        run: go test -race ./internal/store/postgres ./internal/httpapi ./internal/service
      - name: Commit validated tests and permanent gate
        run: |
          git add internal/service/economic_crash_safety_test.go .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: close Phase 1 crash-recovery gates'
          git push origin HEAD:agent/phase0-phase1-completion
