name: ci

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request events normally check out GitHub's synthetic merge
          # ref. TOS Service Protocol validates the exact proposed implementation here; PR
          # mergeability is checked independently by GitHub.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: Verify checked-out revision
        run: |
          echo "event=${{ github.event_name }}"
          echo "expected=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify the repository
        run: make verify
